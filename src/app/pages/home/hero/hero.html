<section class="relative w-full overflow-hidden">
  <img
    [src]="heroSrc"
    alt="SFC Surigao Hero"
    class="w-full h-auto object-cover block"
  />
  <div class="relative h-48 -mt-px overflow-hidden pointer-events-none" aria-hidden="true"
       style="mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.9) 12%, rgba(0,0,0,.7) 30%, rgba(0,0,0,.45) 50%, rgba(0,0,0,.2) 72%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.9) 12%, rgba(0,0,0,.7) 30%, rgba(0,0,0,.45) 50%, rgba(0,0,0,.2) 72%, rgba(0,0,0,0) 100%);">
    <img [src]="heroSrc" alt=""
         class="absolute left-0 -top-6 w-full scale-x-110 scale-y-[-1] blur-[40px] brightness-90 saturate-125" />
  </div>
</section>
