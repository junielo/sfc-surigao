<section class="relative w-full overflow-hidden">
  <img
    [src]="heroSrc"
    alt="SFC Surigao Hero"
    class="w-full h-auto object-cover block"
  />
  <div class="relative h-40 -mt-px overflow-hidden pointer-events-none" aria-hidden="true"
       style="mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.81) 10%, rgba(0,0,0,.64) 20%, rgba(0,0,0,.49) 30%, rgba(0,0,0,.36) 40%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.16) 60%, rgba(0,0,0,.09) 70%, rgba(0,0,0,.04) 80%, rgba(0,0,0,.01) 90%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,.81) 10%, rgba(0,0,0,.64) 20%, rgba(0,0,0,.49) 30%, rgba(0,0,0,.36) 40%, rgba(0,0,0,.25) 50%, rgba(0,0,0,.16) 60%, rgba(0,0,0,.09) 70%, rgba(0,0,0,.04) 80%, rgba(0,0,0,.01) 90%, rgba(0,0,0,0) 100%);">
    <img [src]="heroSrc" alt=""
         class="absolute left-0 -top-6 w-full scale-x-110 scale-y-[-1] blur-[40px] brightness-75 contrast-150 saturate-125" />
  </div>
</section>
