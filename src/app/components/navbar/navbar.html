<nav aria-label="Main" class="fixed top-0 left-0 right-0 w-full px-4 md:px-8 py-3.5 flex items-center justify-between z-50">

  <!-- Glass background: fades in from 0 to 100% between 0 and 150px of scroll (see navbar.scss) -->
  <div class="nav-bg pointer-events-none absolute inset-0 -z-10" aria-hidden="true"></div>

  <!-- Edge-refraction filters used by .nav-bg (Chromium only, see navbar.scss).
       Center of the bar is untouched; only bands along the edges bend the backdrop.
       "sm" = phones (wider side bands), "md" = tablet/desktop. Zero-size and decorative.
       scale values are in PIXELS (maximum bend; the actual shift is up to half of it).
       First pass = sideways bend, second pass = up/down bend. Do NOT switch these back to
       objectBoundingBox units: Chromium then sizes the bend from the bar's width, which pushes the
       top/bottom edge samples out of bounds and leaves an undistorted strip at each edge.
       Raise the numbers for a stronger fisheye, lower them for a subtler one. -->
  <svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">
    <filter id="glass-edge-sm" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage preserveAspectRatio="none" result="map"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='l' x1='0' x2='1' y1='0' y2='0'%3E%3Cstop offset='0' stop-color='%23ff8080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23ff8080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23ff8080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23ff8080' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='r' x1='1' x2='0' y1='0' y2='0'%3E%3Cstop offset='0' stop-color='%23008080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23008080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23008080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23008080' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='t' x1='0' x2='0' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%2380ff80' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%2380ff80' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%2380ff80' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%2380ff80' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' x2='0' y1='1' y2='0'%3E%3Cstop offset='0' stop-color='%23800080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23800080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23800080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23800080' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='%23808080'/%3E%3Crect x='0' y='0' width='10' height='100' fill='url(%23l)'/%3E%3Crect x='90' y='0' width='10' height='100' fill='url(%23r)'/%3E%3Crect x='0' y='0' width='100' height='22' fill='url(%23t)'/%3E%3Crect x='0' y='68' width='100' height='32' fill='url(%23b)'/%3E%3C/svg%3E" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="96" xChannelSelector="R" yChannelSelector="B" result="shiftX" />
      <feDisplacementMap in="shiftX" in2="map" scale="32" xChannelSelector="B" yChannelSelector="G" result="shiftY" />
      <!-- Fallback layer: wherever the displacement output is transparent (near the top/bottom edges),
           a backdrop-filter would reveal the raw, unblurred backdrop. Merging over SourceGraphic
           (the already-blurred backdrop) keeps the glass covering the full height of the bar. -->
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="shiftY" />
      </feMerge>
    </filter>
    <filter id="glass-edge-md" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage preserveAspectRatio="none" result="map"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='l' x1='0' x2='1' y1='0' y2='0'%3E%3Cstop offset='0' stop-color='%23ff8080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23ff8080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23ff8080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23ff8080' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='r' x1='1' x2='0' y1='0' y2='0'%3E%3Cstop offset='0' stop-color='%23008080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23008080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23008080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23008080' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='t' x1='0' x2='0' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%2380ff80' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%2380ff80' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%2380ff80' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%2380ff80' stop-opacity='0'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' x2='0' y1='1' y2='0'%3E%3Cstop offset='0' stop-color='%23800080' stop-opacity='1'/%3E%3Cstop offset='0.35' stop-color='%23800080' stop-opacity='0.4'/%3E%3Cstop offset='0.7' stop-color='%23800080' stop-opacity='0.1'/%3E%3Cstop offset='1' stop-color='%23800080' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='%23808080'/%3E%3Crect x='0' y='0' width='3.5' height='100' fill='url(%23l)'/%3E%3Crect x='96.5' y='0' width='3.5' height='100' fill='url(%23r)'/%3E%3Crect x='0' y='0' width='100' height='22' fill='url(%23t)'/%3E%3Crect x='0' y='68' width='100' height='32' fill='url(%23b)'/%3E%3C/svg%3E" />
      <feDisplacementMap in="SourceGraphic" in2="map" scale="68" xChannelSelector="R" yChannelSelector="B" result="shiftX" />
      <feDisplacementMap in="shiftX" in2="map" scale="32" xChannelSelector="B" yChannelSelector="G" result="shiftY" />
      <!-- Fallback layer: wherever the displacement output is transparent (near the top/bottom edges),
           a backdrop-filter would reveal the raw, unblurred backdrop. Merging over SourceGraphic
           (the already-blurred backdrop) keeps the glass covering the full height of the bar. -->
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="shiftY" />
      </feMerge>
    </filter>
  </svg>

  <!-- Desktop Links & Separators -->
  <div class="hidden md:flex items-center justify-center flex-1 px-8">
    <ul class="flex items-center justify-center gap-4 m-0 p-0 list-none">
      <li class="flex items-center justify-center">
        <div class="flex items-center justify-center">
          <img src="/images/icons/sfc_transparent.png" alt="" class="w-8 h-8 object-contain nav-icon translate-y-[-5px]" />
        </div>
      </li>
      @for (link of navLinks; track link.path; let last = $last) {
        <li class="flex items-center">
          <a
            [routerLink]="link.path"
            [routerLinkActive]="['active']"
            [routerLinkActiveOptions]="link.path === '/' ? { exact: true } : { exact: false }"
            (click)="closeMobileMenu()"
            class="nav-link font-[family-name:var(--font-nav)] text-[18px] text-[var(--color-primary)] no-underline px-1 py-0.5 relative focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-tertiary)] rounded"
          >
            {{ link.label }}
          </a>
        </li>
        @if (!last) {
          <li aria-hidden="true" class="flex items-center justify-center">
            <div class="w-1 h-1 rotate-45 bg-[var(--color-tertiary)] translate-y-[-5px]"></div>
          </li>
        }
      }
    </ul>
  </div>

  <!-- Mobile Hamburger Button -->
  <button
    type="button"
    class="md:hidden flex flex-col justify-center items-center w-11 h-11 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-tertiary)]"
    [attr.aria-expanded]="mobileMenuOpen()"
    aria-label="Toggle navigation menu"
    (click)="toggleMobileMenu()"
  >
    <span
      class="w-6 h-0.5 bg-[var(--color-primary)] transition-transform duration-300 transform"
      [class.rotate-45]="mobileMenuOpen()"
      [class.translate-y-2]="mobileMenuOpen()"
    ></span>
    <span
      class="w-6 h-0.5 bg-[var(--color-primary)] my-1.5 transition-opacity duration-300"
      [class.opacity-0]="mobileMenuOpen()"
    ></span>
    <span
      class="w-6 h-0.5 bg-[var(--color-primary)] transition-transform duration-300 transform"
      [class.-rotate-45]="mobileMenuOpen()"
      [class.-translate-y-2]="mobileMenuOpen()"
    ></span>
  </button>

  <!-- Mobile Dropdown Panel -->
  @if (mobileMenuOpen()) {
    <div
      class="absolute top-full left-0 w-full md:hidden flex flex-col py-6 px-6 animate-enter"
    >
      <ul class="flex flex-col gap-2 m-0 p-0 list-none">
        <li class="flex items-center py-1.5 px-1.5">
          <div class="flex items-center">
            <img src="/images/icons/sfc_transparent.png" alt="" class="w-7 h-7 object-contain nav-icon translate-y-[-3px]" />
          </div>
        </li>
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              [routerLinkActive]="['active']"
              [routerLinkActiveOptions]="link.path === '/' ? { exact: true } : { exact: false }"
              (click)="closeMobileMenu()"
              class="nav-link font-[family-name:var(--font-nav)] text-[12px] text-[var(--color-primary)] no-underline block py-1.5 px-1.5 min-h-[44px] flex items-center rounded focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-tertiary)]"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
